name: Backtest at the opening line (2 seasons)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Get 2023-24 player numbers and the 2023 draft (Basketball-Reference)
        run: |
          if [ ! -f data_static/players_2023_24.csv ]; then python -m engine.fetch_bbref 2024; fi
      - name: Replay both seasons at the opening line
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          set +e
          python -m engine.backtest_open > report.txt 2>&1
          status=$?
          cat report.txt
          { echo '```'; cat report.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $status
      - name: Keep the downloaded data so reruns are free
        if: always()
        run: |
          git config user.name "nba-model-bot"; git config user.email "actions@users.noreply.github.com"
          for f in data_static/players_2023_24.csv data_static/drafts_2023.csv data_static/odds_openclose_*.json data_static/backtest_open.json data_static/personnel_gaps.json; do
            [ -f "$f" ] && git add "$f"
          done
          if ! git diff --cached --quiet; then git commit -m "Backtest data: 2023-24 players, 2023 draft, opening/closing lines" && git pull --rebase && git push; fi
