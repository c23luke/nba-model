name: Run NBA model

on:
  schedule:
    # every 15 minutes, ~9am–2am Eastern in both daylight and standard time.
    # Off-the-hour minutes: GitHub drops/delays scheduled runs most at :00.
    - cron: "7,22,37,52 13-23 * * *"
    - cron: "7,22,37,52 0-6 * * *"
  workflow_dispatch:
    inputs:
      backfill:
        description: "Reload every day since opening night"
        type: boolean
        default: false

concurrency:
  group: nba-model
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run one pass
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python -m engine.run ${{ inputs.backfill && '--backfill' || '' }}
