name: Deploy the watcher to the server

# A push that changes the model's code puts the new code on the always-on server (Fly.io) and restarts the watcher,
# so a fix reaches the board in a couple of minutes, the same as before. Needs the FLY_API_TOKEN secret.
on:
  push:
    branches: [main]
    paths: ["engine/**", "data_static/**", "Dockerfile", "fly.toml"]
  workflow_dispatch:

concurrency:
  group: fly-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --ha=false --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
