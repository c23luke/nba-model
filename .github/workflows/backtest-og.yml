name: Backtest every system (2 seasons)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          set +e
          python -m engine.backtest_og > report.txt 2>&1
          status=$?
          cat report.txt
          { echo '```'; cat report.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $status
      - name: Keep the system + players-model results for the board
        if: always()
        run: |
          git config user.name "nba-model-bot"; git config user.email "actions@users.noreply.github.com"
          [ -f data_static/og_personnel.json ] && git add data_static/og_personnel.json
          if ! git diff --cached --quiet; then git commit -m "Backtest data: systems + players model" && git pull --rebase && git push; fi
