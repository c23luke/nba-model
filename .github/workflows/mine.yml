name: Search for new systems (3 seasons)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mine:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy
      - name: Search
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          set +e
          python -m engine.mine > report.txt 2>&1
          status=$?
          cat report.txt
          { echo '```'; cat report.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $status
      - name: Keep the data
        if: always()
        run: |
          git config user.name "nba-model-bot"; git config user.email "actions@users.noreply.github.com"
          for f in data_static/odds_close_2023_24.json data_static/mined_systems.json; do [ -f "$f" ] && git add "$f"; done
          if ! git diff --cached --quiet; then git commit -m "System search data" && git pull --rebase && git push; fi
