name: Personnel report

on:
  workflow_dispatch:

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Rate every team from its current players
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python -m engine.personnel
