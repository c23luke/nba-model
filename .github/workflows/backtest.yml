name: Backtest personnel model (2025-26)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Replay last season
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          set +e
          python -m engine.backtest > report.txt 2>&1
          status=$?
          cat report.txt
          { echo '```'; cat report.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $status
      - name: Keep the historical lines so reruns cost no credits
        if: always()
        run: |
          if [ -n "$(git status --porcelain data_static/odds_hist_2025_26.json)" ]; then
            git config user.name "nba-model-bot"; git config user.email "actions@users.noreply.github.com"
            git add data_static/odds_hist_2025_26.json
            git commit -m "Cache 2025-26 historical lines (Odds API, 6:30pm ET snapshots)"
            git push
          fi
