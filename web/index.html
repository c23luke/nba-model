<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Courtside</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Courtside — arena at night. One loud thing per screen (the scoreboard, then the pick); everything else quiet. */
:root {
  --floor: #0E1530; --deck: #151E40; --deck2: #1B2650; --line: #283466; --chalk: #EEF1FF; --haze: #8F98C4;
  --leather: #FF7B29; --leather-ink: #1B0C02; --net: #6BE4FF; --win: #3DDC97; --loss: #FF5C7A;
  --display: "Big Shoulders Display", "Arial Narrow", sans-serif; --body: "Figtree", system-ui, sans-serif;
  --cond: var(--display);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { background: var(--floor); }
body { margin: 0; background: radial-gradient(1200px 600px at 50% -200px, #1A2556 0%, var(--floor) 60%) no-repeat, var(--floor);
  color: var(--chalk); font: 16px/1.55 var(--body); -webkit-font-smoothing: antialiased; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--net); outline-offset: 2px; border-radius: 4px; }
.wrap { max-width: 760px; margin: 0 auto; padding: 0 16px; }
.muted { color: var(--haze); }
.n { font-family: var(--display); font-variant-numeric: tabular-nums; letter-spacing: .01em; }
.W, .pos { color: var(--win); } .L, .neg { color: var(--loss); } .P { color: var(--haze); }

/* header */
header { padding: 20px 0 8px; }
.head { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.brand { font: 800 30px/1 var(--display); letter-spacing: .02em; display: flex; align-items: center; gap: 10px; }
.brand::before { content: ""; width: 22px; height: 22px; border-radius: 50%; flex: none;
  background: radial-gradient(circle at 35% 30%, #FFA15E, var(--leather) 55%, #C4510E);
  box-shadow: inset 0 0 0 1.5px rgba(27,12,2,.55), 0 0 18px rgba(255,123,41,.45); }
.fresh { font-size: 13px; color: var(--haze); display: flex; align-items: center; gap: 7px; white-space: nowrap; }
.fresh i { width: 8px; height: 8px; border-radius: 50%; background: var(--win); box-shadow: 0 0 10px var(--win); display: inline-block; }
.fresh.stale i { background: var(--loss); box-shadow: 0 0 10px var(--loss); } .fresh.stale { color: var(--loss); }
.status { margin: 8px 0 0; color: var(--haze); font-size: 15px; }
.warn { color: var(--loss); font-size: 14px; margin-top: 4px; }

/* tabs */
nav { position: sticky; top: 0; z-index: 5; background: rgba(14,21,48,.88); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
.tabs button { font: 700 18px var(--display); letter-spacing: .03em; color: var(--haze); background: none; border: 0;
  padding: 13px 12px 11px; border-bottom: 3px solid transparent; cursor: pointer; white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--chalk); border-bottom-color: var(--leather); }
.tabs button .c { font: 700 13px var(--body); background: var(--leather); color: var(--leather-ink); border-radius: 9px; padding: 1px 7px; margin-left: 5px; vertical-align: 2px; }
@media (max-width: 480px) { .tabs { justify-content: space-between; gap: 0; } .tabs button .long { display: none; }
  .tabs button { padding: 12px 5px 10px; font-size: 17px; } .tabs button .c { margin-left: 3px; padding: 1px 6px; } }
main.wrap { padding: 20px 16px 72px; }
section[hidden] { display: none; }
h2 { font: 800 30px/1.1 var(--display); letter-spacing: .01em; margin: 36px 0 6px; }
h2:first-child { margin-top: 8px; }
.lede { color: var(--haze); margin: 0 0 16px; font-size: 15px; max-width: 64ch; }
.empty { background: var(--deck); border: 1px dashed var(--line); border-radius: 14px; padding: 20px; color: var(--haze); }

/* the scoreboard: the one loud thing on the Bets tab */
.board { position: relative; overflow: hidden; border-radius: 20px; padding: 22px 22px 18px;
  background: linear-gradient(160deg, #1D2A5E 0%, #141C3E 70%); border: 1px solid #2E3B78;
  box-shadow: 0 20px 50px -24px rgba(255,123,41,.35); }
.board .court { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; opacity: .14; }
.board-main { position: relative; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; align-items: end; }
.board .big { display: block; font: 800 72px/.9 var(--display); letter-spacing: .01em; }
.board .lbl { display: block; color: var(--haze); font-size: 14px; margin-top: 6px; }
.board .profit { text-align: right; }
.board-row { position: relative; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 6px 16px; margin-top: 18px; padding-top: 14px; border-top: 1px solid rgba(143,152,196,.25); font-size: 15px; color: var(--haze); }
.board-row b { font: 700 20px var(--display); color: var(--chalk); margin-right: 4px; }
@media (max-width: 520px) { .board .big { font-size: 56px; } .board { padding: 18px 16px 14px; } }

/* bet ticket */
.ticket { background: var(--deck); border: 1px solid var(--line); border-radius: 18px; margin: 14px 0; padding: 16px 18px 12px; }
.t-top { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 10px; font-size: 14px; color: var(--haze); }
.t-top .venue { font-weight: 600; color: var(--chalk); }
.t-top .pl { margin-left: auto; font: 800 24px/1 var(--display); }
.state { font: 700 13px/1 var(--body); padding: 5px 9px; border-radius: 999px; background: var(--deck2); color: var(--chalk); }
.state.OPEN { background: rgba(255,123,41,.16); color: var(--leather); }
.state.LIVE { background: rgba(107,228,255,.16); color: var(--net); }
.state.W { background: rgba(61,220,151,.16); color: var(--win); } .state.L { background: rgba(255,92,122,.16); color: var(--loss); }
.hold { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 12px; margin: 8px 0 2px; }
.hold b { font: 800 46px/1 var(--display); letter-spacing: .01em; }
.hold span { color: var(--haze); font-size: 15px; }
.figs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin: 12px 0; }
.figs div { font-size: 13px; color: var(--haze); background: var(--floor); border-radius: 12px; padding: 8px 10px; }
.figs strong { display: block; font: 700 24px/1.1 var(--display); color: var(--chalk); }
@media (max-width: 560px) { .figs { grid-template-columns: 1fr 1fr; } .hold b { font-size: 40px; } .ticket { padding: 14px 14px 10px; } }
.mkt { font-size: 14px; color: var(--haze); margin: 0 0 8px; }
.mkt b { color: var(--chalk); font-weight: 600; }
.why-h { font-size: 17px; font-weight: 600; margin: 12px 0 2px; }
.size-l { font-size: 14px; color: var(--haze); margin-bottom: 8px; }
.size-l b { color: var(--chalk); }
.why-t { width: 100%; border-collapse: collapse; font-size: 14px; margin: 6px 0 4px; }
.why-t th { text-align: left; font-weight: 500; color: var(--haze); font-size: 12px; padding: 4px 6px 6px; border-bottom: 1px solid var(--line); }
.why-t td { padding: 7px 6px; border-bottom: 1px solid rgba(40,52,102,.6); vertical-align: top; }
.why-t .r { text-align: right; white-space: nowrap; }
.why-t td b { font: 700 17px var(--display); }
.why-t td.good b { color: var(--win); } .why-t td.bad b { color: var(--loss); }
.why-t tr.combo td { background: rgba(255,123,41,.08); }
.why-t tr.combo td:first-child { box-shadow: inset 3px 0 0 var(--leather); }
.why-note { font-size: 12px; color: var(--haze); margin-bottom: 4px; }
@media (max-width: 560px) { .why-t { font-size: 13px; } .why-t .pc { display: block; font-size: 11px; } .why-t td, .why-t th { padding: 5px 3px; } }
.why { font-size: 15px; margin: 6px 0 4px; padding-left: 18px; }
.why li { margin: 2px 0; }
details.more { margin-top: 6px; font-size: 14px; }
details.more summary { cursor: pointer; color: var(--haze); padding: 4px 0; }
details.more summary:hover { color: var(--chalk); }
details.more dl { display: grid; grid-template-columns: max-content 1fr; gap: 3px 16px; margin: 6px 0 4px; }
details.more dt { color: var(--haze); } details.more dd { margin: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
.chip { font: 600 13px/1 var(--body); padding: 5px 9px; border-radius: 999px; background: var(--deck2); color: var(--chalk); }
.chip.Low { background: rgba(255,92,122,.16); color: var(--loss); } .chip.High { background: rgba(61,220,151,.16); color: var(--win); }
.chip.Medium { background: rgba(255,123,41,.16); color: var(--leather); } .chip.stack { background: rgba(61,220,151,.16); color: var(--win); }

/* card + results rows */
.row { display: grid; grid-template-columns: 76px 1fr auto; gap: 4px 16px; padding: 16px; margin: 10px 0; background: var(--deck); border: 1px solid var(--line); border-radius: 16px; align-items: start; }
.verdict { font: 800 16px/1 var(--display); letter-spacing: .04em; text-align: center; padding: 8px 0 7px; border-radius: 10px; background: var(--deck2); color: var(--haze); }
.verdict.BET, .verdict.W { background: var(--win); color: #062A1B; }
.verdict.LIMIT { background: var(--leather); color: var(--leather-ink); }
.verdict.L { background: var(--loss); color: #2A0610; }
.verdict.BENCHED, .verdict.CONFLICT { font-size: 13px; background: none; border: 1.5px dashed var(--line); }
.row .pick { font: 800 30px/1.05 var(--display); }
.row .sub { font-size: 14px; color: var(--haze); }
.row .px { text-align: right; font-size: 14px; color: var(--haze); white-space: nowrap; }
.row .px b { display: block; font: 700 22px var(--display); color: var(--chalk); }
.row .placed { font-size: 14px; color: var(--win); font-weight: 600; margin-top: 6px; }
.row .shop { grid-column: 2 / -1; font-size: 13px; color: var(--haze); }
.row .shop summary { cursor: pointer; }
.shop table { margin-top: 6px; }
@media (max-width: 600px) { .row { grid-template-columns: 60px 1fr; padding: 14px 12px; } .row .px { grid-column: 2; text-align: left; } .row .shop { grid-column: 1 / -1; } }

/* tables */
table { width: 100%; border-collapse: collapse; font-size: 15px; }
th { text-align: left; font-weight: 500; color: var(--haze); font-size: 13px; padding: 8px; border-bottom: 1px solid var(--line); }
td { padding: 10px 8px; border-bottom: 1px solid rgba(40,52,102,.6); vertical-align: top; }
td.r, th.r { text-align: right; white-space: nowrap; }
td .n { font-size: 19px; }
.seg { display: inline-flex; background: var(--deck); border: 1px solid var(--line); border-radius: 999px; padding: 4px; gap: 2px; margin: 6px 0 14px; flex-wrap: wrap; }
.seg button { font: 600 14px var(--body); border: 0; background: none; color: var(--haze); padding: 7px 13px; border-radius: 999px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--leather); color: var(--leather-ink); }
.seg button[aria-pressed="true"] .muted { color: var(--leather-ink); opacity: .7; }
.badge { display: inline-block; font: 600 12px/1 var(--body); padding: 4px 8px; border-radius: 999px; margin-right: 6px; vertical-align: 2px; background: var(--deck2); color: var(--haze); }
.badge.OG, .badge.FAV { background: rgba(255,123,41,.16); color: var(--leather); }
.badge.EARLY { background: rgba(107,228,255,.14); color: var(--net); }

/* systems leaderboard */
.sys { background: var(--deck); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; }
.sys table td, .sys table th { padding-left: 14px; padding-right: 14px; }
.sys .nm { font-weight: 600; }
.sys .nm .tag { font: 800 18px var(--display); margin-right: 6px; }
.sys .rule { font-size: 13px; color: var(--haze); margin-top: 2px; max-width: 46ch; }
.dot { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--haze); margin-top: 4px; }
.dot::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--haze); }
.dot.on { color: var(--leather); } .dot.on::before { background: var(--leather); box-shadow: 0 0 8px var(--leather); }
.dot.bench { color: var(--loss); } .dot.bench::before { background: var(--loss); }
.sys td.good b { color: var(--win); } .sys td.bad b { color: var(--loss); }
.sys td b { font: 700 18px var(--display); }
.sys .rule { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
@media (max-width: 600px) {
  .sys .hide-s, .lb .hide-s { display: none; }
  .sys thead { display: none; }
  .sys tr { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-bottom: 1px solid var(--line); padding: 12px 14px 10px; }
  .sys td { border: 0; padding: 0; }
  .sys td:first-child { grid-column: 1 / -1; margin-bottom: 8px; }
  .sys td.r { text-align: left; }
  .sys td.span { grid-column: span 2; }
  .sys td.r::before { content: attr(data-label); display: block; font: 500 12px var(--body); color: var(--haze); }
  .sys .pc { display: block; font-size: 11px; }
}

/* lab */
.lab details.box { background: var(--deck); border: 1px solid var(--line); border-radius: 16px; padding: 4px 16px; margin: 10px 0; }
.lab details.box > summary { cursor: pointer; font: 700 22px var(--display); padding: 10px 0; list-style: none; display: flex; justify-content: space-between; gap: 10px; }
.lab details.box > summary::after { content: "+"; color: var(--haze); }
.lab details.box[open] > summary::after { content: "−"; }
.lab details.box > summary small { font: 400 14px var(--body); color: var(--haze); margin-left: auto; align-self: center; }
.lab .inner { padding: 0 0 14px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }
.grid2 h3 { font: 700 18px var(--display); color: var(--haze); margin: 6px 0 4px; }
.case { border-top: 1px solid var(--line); padding: 12px 0; }
.case .pick { font: 800 26px var(--display); }
.case .cl { font-size: 14px; margin: 2px 0; } .case .cl.sub { padding-left: 14px; color: var(--haze); }
.case details { margin-top: 4px; } .case summary { cursor: pointer; font-weight: 600; font-size: 15px; }
.game { padding: 10px 0; border-bottom: 1px solid var(--line); display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; }
.game .t { font: 700 22px var(--display); }
.foot { color: var(--haze); font-size: 13px; margin-top: 40px; }

/* filters, chart, not placed, leaderboard bits */
.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 18px 0 2px; font-size: 14px; color: var(--haze); }
.filters select { font: 500 15px var(--body); color: var(--chalk); background: var(--deck); border: 1px solid var(--line); border-radius: 999px; padding: 7px 12px; }
.chart { background: var(--deck); border: 1px solid var(--line); border-radius: 18px; padding: 14px 16px 10px; margin-top: 12px; }
.chart .top { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 4px 16px; font-size: 14px; color: var(--haze); }
.chart .top b { font: 700 20px var(--display); color: var(--chalk); }
.chart svg { display: block; width: 100%; height: 170px; margin-top: 8px; overflow: visible; }
.chart .key { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13px; color: var(--haze); margin-top: 6px; }
.chart .key i { display: inline-block; width: 14px; height: 3px; border-radius: 2px; vertical-align: 3px; margin-right: 5px; }
.np { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.np .pick { font: 700 22px var(--display); }
.np .reason { font-size: 14px; color: var(--haze); grid-column: 1 / -1; }
.lb th button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
.lb th button[aria-pressed="true"] { color: var(--chalk); font-weight: 600; }
.spark { display: inline-flex; gap: 2px; vertical-align: middle; }
.spark i { width: 6px; height: 14px; border-radius: 2px; background: var(--line); display: inline-block; }
.spark i.W { background: var(--win); } .spark i.L { background: var(--loss); }
.rec { display: flex; flex-wrap: wrap; gap: 4px 22px; font-size: 14px; color: var(--haze); }
@media (prefers-reduced-motion: no-preference) {
  .board .big { animation: lift .6s cubic-bezier(.2,.7,.2,1) both; }
  .board .profit .big { animation-delay: .08s; }
  @keyframes lift { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  .tabs button { transition: color .15s, border-color .15s; }
}
</style>
</head>
<body>
<header class="wrap">
  <div class="head"><div class="brand">Courtside</div><div id="fresh" class="fresh"><i></i><span>Loading…</span></div></div>
  <p id="status" class="status"></p>
  <div id="warn" class="warn" hidden></div>
</header>
<nav><div class="wrap tabs" role="tablist" id="tabs">
  <button role="tab" data-tab="bets" aria-selected="true">Bets<span class="long"> placed</span><span class="c" id="c-bets" hidden></span></button>
  <button role="tab" data-tab="card" aria-selected="false"><span class="long">Today's </span>Card<span class="c" id="c-card" hidden></span></button>
  <button role="tab" data-tab="rankings" aria-selected="false">Rank<span class="long">ings</span></button>
  <button role="tab" data-tab="results" aria-selected="false">Results</button>
  <button role="tab" data-tab="systems" aria-selected="false">Systems</button>
  <button role="tab" data-tab="lab" aria-selected="false">Lab</button>
</div></nav>
<main class="wrap">
  <section id="tab-bets" role="tabpanel"></section>
  <section id="tab-card" role="tabpanel" hidden></section>
  <section id="tab-rankings" role="tabpanel" hidden></section>
  <section id="tab-results" role="tabpanel" hidden></section>
  <section id="tab-systems" role="tabpanel" hidden></section>
  <section id="tab-lab" role="tabpanel" class="lab" hidden></section>
  <p class="foot" id="foot"></p>
</main>

<script src="config.js" onerror="void 0"></script>
<script>
const cfg = window.BOARD_CONFIG || {};
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const d = iso => iso ? new Date(String(iso).replace("Z", "+00:00")) : null;
const tipTime = iso => iso ? d(iso).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }) : "";
const tipDay = iso => iso ? d(iso).toLocaleDateString([], { weekday: "short", month: "short", day: "numeric" }) : "";
const when = iso => iso ? `${tipDay(iso)}, ${tipTime(iso)}` : "";
const ago = iso => { const m = Math.round((Date.now() - d(iso)) / 60000); return m < 1 ? "just now" : m < 60 ? `${m} min ago` : `${Math.round(m / 60)} h ago`; };
const money = x => x == null ? "—" : `${x < 0 ? "−" : ""}$${Math.abs(x).toFixed(2)}`;
const signed$ = x => x == null ? "—" : `${x > 0 ? "+" : x < 0 ? "−" : ""}$${Math.abs(x).toFixed(2)}`;
const pct = (x, dp = 1) => x == null ? "—" : `${x > 0 ? "+" : ""}${(x * 100).toFixed(dp)}%`;
const amer = a => a == null ? "" : (a > 0 ? "+" : "−") + Math.abs(a);
const wl = r => r && (r.w + r.l) ? `${r.w}-${r.l}${r.p ? "-" + r.p : ""}` : "0-0";
const winp = r => r && (r.w + r.l) ? `${Math.round(r.w / (r.w + r.l) * 100)}%` : "";
const GROUP_NAMES = { OG: "OG system · bet", FAV: "Card system · bet",
  EARLY: "Early system · bet with players 3+", TEST: "Tracked only, not bet", SHADOW: "Tracked only, not bet" };
const badge = g => g ? `<span class="badge ${g}" title="${GROUP_NAMES[g] || g}">${GROUP_NAMES[g] || g}</span>` : "";
const etDate = iso => iso ? d(iso).toLocaleDateString("en-CA", { timeZone: "America/New_York" }) : "";
const until = iso => { const m = Math.round((d(iso) - Date.now()) / 60000); if (m <= 0) return "any minute";
  const h = Math.floor(m / 60); return h >= 24 ? `in ${Math.floor(h / 24)}d ${h % 24}h` : h ? `in ${h}h ${m % 60}m` : `in ${m}m`; };
const lineTxt = (bet, side, x) => bet === "total" ? `${side} ${x}` : `${side} ${x > 0 ? "+" : x < 0 ? "−" : ""}${x === 0 ? "PK" : Math.abs(x)}`;
const units = u => `<span class="n ${u > 0 ? "pos" : u < 0 ? "neg" : ""}">${u > 0 ? "+" : ""}${u ?? 0}u</span>`;


// ---------- "why we bet": every system on the side, graded season by season
let BOARD = {};
const SEASONS = ["2024-25", "2025-26"];
const rc = () => BOARD.report_card || {};
const pctOf = r => r && (r.w + r.l) ? Math.round(r.w / (r.w + r.l) * 100) : null;
const recCell = r => r && (r.w + r.l) ? `<b>${wl(r)}</b><span class="pc muted"> ${pctOf(r)}%</span>` : `<span class="muted">—</span>`;
const recCellTone = r => { const p = pctOf(r); return p == null || r.w + r.l < 20 ? "" : p >= 55 ? "good" : p < 52.4 ? "bad" : ""; };
function seasonRecByTag(tag) {
  const all = { ...(BOARD.systems || {}), ...(BOARD.test_systems || {}), ...(BOARD.early_systems || {}) };
  return Object.values(all).find(s => s.tag === tag) || null;
}
function sysName(tag) { const s = seasonRecByTag(tag); return s ? s.name || "" : ""; }
const gapBucket = g => g == null || g < 3 ? null : g >= 6 ? "6+" : g >= 4 ? "4-6" : "3-4";
function playersSeason(bucket) {
  const t = (BOARD.tracking || {}).personnel_by_gap || {}, k = bucket.replace("-", "–");
  return t[k] || null;
}
// tags: every system on this side; gap: players model points on this side (null = no read)
function whyBets(tags, gap, side) {
  const R = rc(), sys = [...new Set(tags)].filter(t => t && t !== "T13" && t !== "MONEYBALL");
  const rows = [];
  for (const t of sys) {
    const h = (R.systems || {})[t], o = (R.other || {})[t];
    const name = `${esc(t)}${sysName(t) ? ` <span class="muted">· ${esc(sysName(t))}</span>` : ""}`;
    if (h || !o) rows.push({ name, cells: [(h || {})[SEASONS[0]], (h || {})[SEASONS[1]], seasonRecByTag(t)] });
    else rows.push({ name, span: `${recCell(o)} <span class="muted">${esc(o.label)}</span>`, tone: recCellTone(o), cells: [seasonRecByTag(t)] });
  }
  const b = gapBucket(gap);
  if (gap != null) {
    const txt = gap >= 0 ? `likes ${esc(side)} by ${gap.toFixed(1)} pts` : `likes the other side by ${Math.abs(gap).toFixed(1)}`;
    if (b) { const h = (R.players_gap || {})[b] || {};
      rows.push({ name: `Players model <span class="muted">· ${txt} (gap ${b})</span>`, cells: [h[SEASONS[0]], h[SEASONS[1]], playersSeason(b)] }); }
    else rows.push({ name: `Players model <span class="muted">· ${txt} — too small to count</span>`, cells: null });
  }
  if (sys.length >= 2 && gap != null && gap >= 3) {
    const h = R.moneyball || {};
    rows.push({ name: `<b>All together: MONEYBALL</b> <span class="muted">· 2+ systems + players 3+</span>`, cells: [h[SEASONS[0]], h[SEASONS[1]], seasonRecByTag("MONEYBALL")], combo: true });
  } else if (sys.some(t => t && t[0] === "E") && gap != null && gap >= 3) {
    const h = R.early_combo || {};
    rows.push({ name: `<b>All together</b> <span class="muted">· early system + players 3+</span>`, cells: [h[SEASONS[0]], h[SEASONS[1]], null], combo: true });
  }
  if (!rows.length) return "";
  return `<table class="why-t"><tr><th>What's behind it</th><th class="r">${SEASONS[0]}</th><th class="r">${SEASONS[1]}</th><th class="r">This season</th></tr>` +
    rows.map(r => `<tr class="${r.combo ? "combo" : ""}"><td>${r.name}</td>${r.span ? `<td colspan="2" class="r ${r.tone}">${r.span}</td>` : ""}${r.cells ? r.cells.map(c => `<td class="r ${recCellTone(c)}">${recCell(c)}</td>`).join("") : `<td colspan="3"></td>`}</tr>`).join("") +
    `</table><div class="why-note">Past seasons replayed at the opening line. Green = 55%+, red = under 52.4% (losing after the vig); colored only with 20+ bets.</div>`;
}
function whyHead(tag, tags, gap, side) {
  const sys = [...new Set(tags)].filter(t => t && t !== "T13" && t !== "MONEYBALL");
  if (tag === "MONEYBALL") return `MONEYBALL: ${sys.length} systems on ${esc(side)} and the players model agrees by ${gap != null ? gap.toFixed(1) : "3+"}`;
  if (tag === "T13") return `Players model: rates ${esc(side)} ${gap != null ? gap.toFixed(1) + " pts" : ""} better than the market${sys.length ? `, and ${sys.map(esc).join(", ")} agree${sys.length === 1 ? "s" : ""}` : ""}`;
  if (tag && tag[0] === "E") return `${esc(tag)} (early-season system) with the players model agreeing by 3+`;
  return `${esc(tag)} fired${sys.length > 1 ? `, with ${sys.filter(t => t !== tag).map(esc).join(", ")} on the same side` : ""}`;
}
const sizeRule = tag => tag === "MONEYBALL" ? "MONEYBALL bets are sized to win $30" : "every card bet is sized to win $20 (MONEYBALL $30)";

// ---------- tabs (remembered per viewer; works without storage too)
const TABS = ["bets", "card", "rankings", "results", "systems", "lab"];
function show(tab, push = true) {
  if (!TABS.includes(tab)) tab = "bets";
  for (const t of TABS) {
    $("tab-" + t).hidden = t !== tab;
    document.querySelector(`[data-tab="${t}"]`).setAttribute("aria-selected", String(t === tab));
  }
  if (push) { history.replaceState(null, "", "#" + tab); try { localStorage.setItem("tab", tab); } catch (e) {} }
}
$("tabs").addEventListener("click", e => { const b = e.target.closest("button[data-tab]"); if (b) show(b.dataset.tab); });
let start = location.hash.slice(1);
if (!start) { try { start = localStorage.getItem("tab") || "bets"; } catch (e) { start = "bets"; } }
show(start, false);

async function load() {
  if (cfg.supabaseUrl && cfg.anonKey) {
    const r = await fetch(`${cfg.supabaseUrl}/rest/v1/board?id=eq.1&select=data`,
      { headers: cfg.anonKey.startsWith("sb_") ? { apikey: cfg.anonKey } : { apikey: cfg.anonKey, Authorization: `Bearer ${cfg.anonKey}` }, cache: "no-store" });
    if (!r.ok) throw new Error(`The database answered ${r.status}. Try again in a minute.`);
    const rows = await r.json();
    if (!rows.length) throw new Error("The model hasn't written a board yet. Run the GitHub Action once.");
    return rows[0].data;
  }
  const r = await fetch("data/board.json", { cache: "no-store" });
  if (!r.ok) throw new Error("No board found. Add config.js with your Supabase keys, or run the model locally.");
  return r.json();
}

// ---------- header
function renderHead(b, placed) {
  const mins = (Date.now() - d(b.generated_at)) / 60000;
  const etHour = Number(new Date().toLocaleString("en-US", { timeZone: "America/New_York", hour: "numeric", hourCycle: "h23" }));
  const stale = (etHour >= 10 || etHour < 2) && mins > 45;
  $("fresh").className = "fresh" + (stale ? " stale" : "");
  $("fresh").querySelector("span").textContent = stale ? `Model last ran ${ago(b.generated_at)}` : `Updated ${ago(b.generated_at)}`;
  const warn = (b.notes || []).filter(n => /fail|error/i.test(n));
  $("warn").hidden = !warn.length;
  $("warn").textContent = warn.length ? `${warn.length} warning${warn.length > 1 ? "s" : ""}: ${warn[0].slice(0, 120)}` : "";
  const s = placed.summary || {};
  const held = new Set((placed.bets || []).map(x => `${x.game_id}|${x.side}`));
  const toBet = notPlaced(b, placed).filter(c => c.verdict === "BET").length;
  const nextTip = (placed.bets || []).filter(x => x.status === "OPEN").map(x => x.tip_utc).sort()[0];
  const parts = [];
  if (s.open) parts.push(`${s.open} bet${s.open > 1 ? "s" : ""} open, ${money(s.at_risk)} at risk to win ${money(s.open_to_win)}`);
  if (nextTip) parts.push(`First tip ${when(nextTip)}`);
  if (toBet) parts.push(`${toBet} card bet${toBet > 1 ? "s" : ""} not placed yet (see why on the Bets tab)`);
  $("status").textContent = parts.length ? parts.join(". ") + "." : "No open bets. New bets are placed automatically when the card fires.";
  document.title = s.open ? `(${s.open}) Courtside` : "Courtside";
  const cb = $("c-bets"); cb.hidden = !s.open; cb.textContent = s.open || "";
  const nCard = (b.card || []).length; const cc = $("c-card"); cc.hidden = !nCard; cc.textContent = nCard;
}

// ---------- bets placed
let placedKeys = new Set();
function ticket(x) {
  const stateTxt = x.status === "FINAL" ? (x.result === "W" ? "Won" : x.result === "L" ? "Lost" : "Push") : x.status === "LIVE" ? "Live" : "Open";
  const stateCls = x.status === "FINAL" ? x.result : x.status;
  const price = x.venue === "kalshi" ? `${Math.round(x.price * 100)}¢ <span class="muted">${amer(x.american)}</span>` : amer(x.american);
  const card = x.card_pick && x.card_pick !== x.holding ? `card pick ${esc(x.card_pick)}` : "";
  const score = x.score && x.score.home != null ? `${esc(x.away)} ${x.score.away}, ${esc(x.home)} ${x.score.home}` : "";
  const pl = x.status === "FINAL" ? `<span class="pl ${x.pnl > 0 ? "pos" : x.pnl < 0 ? "neg" : ""}">${signed$(x.pnl)}</span>` : "";
  const top = x.status === "OPEN" ? `Tips ${esc(until(x.tip_utc))}, ${esc(when(x.tip_utc))}` : score ? esc(score) + (x.status === "LIVE" ? " (live)" : "") : esc(tipDay(x.tip_utc));
  return `<article class="ticket">
      <div class="t-top"><span class="venue">${esc(x.venue_name)}</span><span class="state ${stateCls}">${stateTxt}</span><span>${top}</span>${pl}</div>
      <div class="hold"><b>${esc(x.holding)}</b><span>${esc(x.away)} @ ${esc(x.home)}${card ? ", " + card : ""}</span></div>
      <div class="figs">
        <div>Price<strong>${price}</strong></div>
        <div>Risked<strong>${money(x.risk)}</strong></div>
        <div>To win<strong>${money(x.to_win)}</strong></div>
        <div>Edge<strong class="${x.ev > 0 ? "pos" : ""}">${pct(x.ev)}</strong></div>
      </div>
      ${marketLine(x)}
      <div class="why-h">Why: ${whyHead(x.system, [x.system, ...(x.with || [])], x.players, x.side)}</div>
      <div class="size-l">${sizeLine(x)}</div>
      ${whyBets([x.system, ...(x.with || [])], x.players, x.side)}
      ${(x.evidence || []).length ? `<details class="more"><summary>The model's notes</summary><ul class="why">${x.evidence.map(e => `<li>${esc(e)}</li>`).join("")}</ul></details>` : ""}
      <details class="more"><summary>Order details</summary><dl>
        <dt>Bought</dt><dd>${esc(x.contract)}</dd>
        ${x.price_note ? `<dt>Price check</dt><dd>${esc(x.price_note)}</dd>` : ""}
        <dt>Size</dt><dd>${x.count} ${x.venue === "kalshi" ? "contracts" : "payout dollars"} · cost ${money(x.cost)} · fee ${money(x.fees)}</dd>
        ${x.win != null ? `<dt>Model win rate</dt><dd>${(x.win * 100).toFixed(1)}% at the card's number</dd>` : ""}
        ${x.model_price != null ? `<dt>Most we'd pay</dt><dd>${x.venue === "kalshi" ? Math.round(x.model_price * 100) + "¢" : (x.model_price * 100).toFixed(1) + "%"} (the price the model saw)</dd>` : ""}
        <dt>Placed</dt><dd>${esc(when(x.placed_at))}</dd>
      </dl></details>
  </article>`;
}

function sizeLine(x) {
  const T = x.system === "MONEYBALL" ? 30 : 20, got = x.actual ? x.actual.to_win : x.to_win;
  let t = `Size: to win <b>${money(T)}</b> — ${sizeRule(x.system)}.`;
  if (got != null && got < T - 1 && x.status === "OPEN") t += ` Got ${money(got)} so far: only part filled at our price, and it tops up when more is offered.`;
  return t;
}

function marketLine(x) {
  const m = x.market;
  if (x.status === "LIVE" && x.covering != null) {
    const c = x.covering;
    return `<div class="mkt"><b class="${c > 0 ? "pos" : c < 0 ? "neg" : ""}">${c > 0 ? "Covering by " + c : c < 0 ? "Behind by " + Math.abs(c) : "Right on the number"}</b> at ${esc(x.holding)}</div>`;
  }
  if (!m) return "";
  const moved = m.moved == null ? "" : m.moved === 0 ? ", no move since we bet" : `, ${m.moved > 0 ? "moved " + m.moved + " our way" : "moved " + Math.abs(m.moved) + " against us"} since we bet`;
  if (!m.closed) return `<div class="mkt">Line now <b>${esc(lineTxt(x.bet, x.side, m.line))}</b>${moved}${m.beat_close != null ? `. Worth <b class="${m.beat_close > 0 ? "pos" : m.beat_close < 0 ? "neg" : ""}">${m.beat_close > 0 ? "+" : ""}${m.beat_close}¢</b> vs what we paid` : ""}</div>`;
  return `<div class="mkt">Closed <b>${esc(lineTxt(x.bet, x.side, m.line))}</b>${moved}${m.beat_close != null ? `. ${m.beat_close >= 0 ? "Beat the close by" : "Lost to the close by"} <b class="${m.beat_close > 0 ? "pos" : m.beat_close < 0 ? "neg" : ""}">${Math.abs(m.beat_close)}¢</b>` : ""}</div>`;
}

// profit by day, settled bets only: total plus one line per site
function profitChart(bets) {
  const done = bets.filter(x => x.status === "FINAL" && x.pnl != null);
  if (!done.length) return `<div class="chart"><div class="top"><span>Profit by day</span><span>Shows up after the first bet settles.</span></div></div>`;
  const days = [...new Set(done.map(x => etDate(x.tip_utc)))].sort();
  const sites = [...new Set(done.map(x => x.venue_name))];
  const cum = key => { let t = 0; return [0, ...days.map(dy => (t += done.filter(x => etDate(x.tip_utc) === dy && (key == null || x.venue_name === key)).reduce((a, x) => a + x.pnl, 0)))]; };
  const series = [{ name: "All sites", v: cum(null), cls: "var(--amber)", w: 3 }, ...(sites.length > 1 ? sites.map((v, i) => ({ name: v, v: cum(v), cls: ["var(--early)", "var(--win)", "var(--muted)"][i % 3], w: 1.5 })) : [])];
  const all = series.flatMap(x => x.v), lo = Math.min(0, ...all), hi = Math.max(0, ...all), span = hi - lo || 1;
  const W = 600, H = 170, n = days.length;
  const X = i => n ? (i / n) * W : 0, Y = v => H - 8 - ((v - lo) / span) * (H - 16);
  const path = v => v.map((y, i) => `${i ? "L" : "M"}${X(i).toFixed(1)},${Y(y).toFixed(1)}`).join("");
  const tot = series[0].v[n], avgClv = (() => { const xs = done.filter(x => x.market && x.market.beat_close != null).map(x => x.market.beat_close); return xs.length ? xs.reduce((a, b) => a + b, 0) / xs.length : null; })();
  return `<div class="chart">
    <div class="top"><span>Profit by day <b class="${tot > 0 ? "pos" : tot < 0 ? "neg" : ""}">${signed$(tot)}</b></span>
      <span>${avgClv == null ? "" : `${avgClv >= 0 ? "Beat the close by" : "Behind the close by"} <b class="${avgClv > 0 ? "pos" : avgClv < 0 ? "neg" : ""}">${Math.abs(avgClv).toFixed(1)}¢</b> a bet on average`}</span></div>
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Cumulative profit by day">
      <line x1="0" x2="${W}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--line)" stroke-dasharray="4 4" vector-effect="non-scaling-stroke"/>
      ${series.slice().reverse().map(x => `<path d="${path(x.v)}" fill="none" stroke="${x.cls}" stroke-width="${x.w}" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>`).join("")}
      ${n === 1 ? `<circle cx="${X(1)}" cy="${Y(tot)}" r="4" fill="var(--amber)"/>` : ""}
    </svg>
    <div class="key">${series.map(x => `<span><i style="background:${x.cls}"></i>${esc(x.name)} ${signed$(x.v[n])}</span>`).join("")}<span>${esc(tipDay(days[0] + "T16:00Z"))} to ${esc(tipDay(days[n - 1] + "T16:00Z"))}</span></div>
  </div>`;
}

// card bets the order placer hasn't placed, with its latest reason
function notPlaced(b, placed) {
  const held = new Set((placed.bets || []).map(x => `${x.game_id}|${x.side}`));
  const resting = new Set((placed.resting || []).map(x => x.key));
  const why = Object.fromEntries(((b.placer || {}).skips || []).map(k => [k.pick, k.reason]));
  return (b.card || []).filter(c => (c.verdict === "BET" || c.verdict === "LIMIT") && !placedKeys.has(c.key) && !resting.has(c.key) && !held.has(`${c.game_id}|${c.side}`))
    .map(c => ({ ...c, reason: why[`${c.label} (${c.tag}) ${c.away}@${c.home}`] }))
    .filter(c => !/^already (filled|partial)/.test(c.reason || ""));          // held from before the Oct 27 restart
}

let fSite = "", fSys = "";
// Caden 2026-10-27: show every bet as if today's rules ran all season (full $20 size, T13 only at 4+,
// never both sides). The real account money rides along on each bet as x.actual.
const asRules = x => { const R = x.rules; if (!R || R.counted === false) return x;
  return { ...x, actual: { pnl: x.pnl, risk: x.risk, to_win: x.to_win }, pnl: R.pnl ?? x.pnl, risk: R.risk ?? x.risk, to_win: R.to_win ?? x.to_win }; };
function renderBets(placed, b) {
  const rawBets = placed.bets || [];
  const dropped = rawBets.filter(x => x.rules && x.rules.counted === false);
  const allBets = rawBets.filter(x => !(x.rules && x.rules.counted === false)).map(asRules);
  const bets = allBets.filter(x => (!fSite || x.venue_name === fSite) && (!fSys || x.system === fSys));
  const open = bets.filter(x => x.status !== "FINAL"), done = bets.filter(x => x.status === "FINAL");
  const sum = (xs, k) => Math.round(xs.reduce((t, x) => t + (x[k] || 0), 0) * 100) / 100;
  const w = done.filter(x => x.result === "W").length, l = done.filter(x => x.result === "L").length, pu = done.filter(x => x.result === "P").length;
  const pnl = sum(done, "pnl"), risked = sum(done, "risk");
  const expOpen = Math.round(open.reduce((t, x) => t + (x.ev || 0) * x.risk, 0) * 100) / 100;
  const sites = {}; for (const x of bets) sites[x.venue_name] = (sites[x.venue_name] || 0) + 1;
  const opts = (vals, cur, all) => `<option value="">${all}</option>` + vals.map(v => `<option${v === cur ? " selected" : ""}>${esc(v)}</option>`).join("");
  const uniq = k => [...new Set(allBets.map(x => x[k] || "None"))].sort();
  const np = notPlaced(b, placed);
  const cardSys = [...Object.values(b.systems || {}), ...Object.values(b.test_systems || {}).filter(x => x.group === "FAV")];
  const cardRec = { w: cardSys.reduce((t, x) => t + (x.w || 0), 0), l: cardSys.reduce((t, x) => t + (x.l || 0), 0) };
  const placerAt = (b.placer || {}).at;
  const court = `<svg class="court" viewBox="0 0 400 200" preserveAspectRatio="xMidYMid slice" aria-hidden="true" fill="none" stroke="#FF7B29" stroke-width="1.5">
      <circle cx="200" cy="100" r="34"/><circle cx="200" cy="100" r="10"/><line x1="200" y1="-10" x2="200" y2="210"/>
      <path d="M-40 10 A120 120 0 0 1 -40 190"/><path d="M440 10 A120 120 0 0 0 440 190"/>
      <rect x="-10" y="64" width="70" height="72"/><rect x="340" y="64" width="70" height="72"/></svg>`;
  $("tab-bets").innerHTML = `<div class="board">${court}
      <div class="board-main">
        <div><span class="big n">${w}-${l}${pu ? "-" + pu : ""}</span><span class="lbl">Record${w + l ? `, ${Math.round(w / (w + l) * 100)}% won` : ""}</span></div>
        <div class="profit"><span class="big n ${pnl > 0 ? "pos" : pnl < 0 ? "neg" : ""}">${signed$(pnl)}</span><span class="lbl">${risked ? pct(pnl / risked) + " return on " + money(risked) : "Profit"}</span></div>
      </div>
      <div class="board-row"><span><b>${open.length}</b>open, ${money(sum(open, "risk"))} risked to win ${money(sum(open, "to_win"))}</span><span><b class="${expOpen > 0 ? "pos" : ""}">${signed$(expOpen)}</b>expected on open bets</span></div>
    </div>
    ${allBets.length ? `${profitChart(bets)}
    <div class="filters">Show
      <select id="f-site" aria-label="Site">${opts(uniq("venue_name"), fSite, "All sites")}</select>
      <select id="f-sys" aria-label="System">${opts(uniq("system"), fSys, "All systems")}</select>
    </div>` : ""}` +
    `<h2>Open bets</h2><p class="lede">Placed for you at the best price on Kalshi, ProphetX and BetOpenly. Every bet is sized to win $20, MONEYBALL bets $30.</p>` +
    (open.length ? open.map(ticket).join("") : `<div class="empty">${allBets.length && (fSite || fSys) ? "No open bets match these filters." : "No open bets. When a card bet fires and the price is right, it gets placed and shows up here."}</div>`) +
    ((placed.resting || []).length ? `<h2>Waiting for a price</h2><p class="lede">LIMIT bets: an order is sitting on Kalshi at the most we'd pay. It fills if the price comes to us, and is cancelled 5 minutes before tip or if the model stops wanting it.</p>` +
      placed.resting.map(r => `<div class="np"><div class="pick">${esc(r.holding)} <span class="muted" style="font:400 14px var(--body)">${esc(r.system)}, card pick ${esc(r.pick)}, tips ${esc(until(r.tip_utc))}</span></div>
        <div class="n" style="font-size:18px">${Math.round(r.price * 100)}¢ <span class="muted">${amer(r.american)}</span></div>
        <div class="reason">${esc(r.venue_name)}: ${r.count} contracts, ${money(r.stake)} if it all fills${r.filled ? `, ${r.filled} filled so far` : ""}. ${esc(r.contract)}</div></div>`).join("") : "") +
    (np.length ? `<h2>On the card, not placed</h2><p class="lede">What the order placer said on its last check${placerAt ? ` (${esc(ago(placerAt))})` : ""}.</p>` +
      np.map(c => `<div class="np"><div class="pick">${esc(c.label)} <span class="muted" style="font:400 14px var(--body)">${esc(c.tag)}, ${esc(c.away)} @ ${esc(c.home)}, ${esc(when(c.tip_utc))}</span></div><div class="verdict ${c.verdict}" style="padding:5px 8px">${c.verdict}</div>
        <div class="reason">${esc(c.reason || "Not checked yet: the order placer looks every minute and logs its reasons every 15.")}</div></div>`).join("") : "") +
    (done.length ? `<h2>Settled</h2>` + done.slice().reverse().map(ticket).join("") : "") +
    ((placed.excluded || []).length ? `<p class="foot"><b>Left out of all records (model bug):</b> ` +
      placed.excluded.map(x => `${esc(x.holding)} on ${esc(x.venue_name)}${x.result ? ` (${x.result}, ${x.pnl >= 0 ? "+" : "−"}${money(Math.abs(x.pnl))})` : " (open)"}`).join(", ") +
      `. ${esc(placed.excluded[0].why || "")} That money is real, so it's shown here: ${(placed.summary.excluded_pnl || 0) >= 0 ? "+" : "−"}${money(Math.abs(placed.summary.excluded_pnl || 0))} settled so far.</p>` : "") +
    (placed.summary && placed.summary.since ? `<p class="foot">Fresh start Oct 27 with today's rules: every record on this site counts from then. Each bet is graded at the number we actually hold. "Beat the close" compares what we paid with what our exact number was worth at the closing line.</p>` : "");
  for (const [id, set] of [["f-site", v => fSite = v], ["f-sys", v => fSys = v]]) {
    const el = $(id); if (el) el.onchange = () => { set(el.value); renderBets(placed, b); };
  }
}

// ---------- today's card
function renderCard(b, placed) {
  const byKey = Object.fromEntries((placed.bets || []).map(x => [x.key, x]));
  const skipWhy = Object.fromEntries(notPlaced(b, placed).filter(c => c.reason).map(c => [c.key, c.reason]));
  const card = b.card || [], hold = b.card_holding || [];
  const row = c => {
    const p = byKey[c.key];
    const best = c.best;
    return `<div class="row">
      <div class="verdict ${c.verdict}">${c.verdict}</div>
      <div><div class="pick">${esc(c.label)}</div>
        <div class="sub">${esc(c.away)} @ ${esc(c.home)}, ${esc(when(c.tip_utc))}</div>
        <div class="why-h">Why: ${whyHead(c.tag, [c.tag, ...(c.with || [])], c.players, c.side)}</div>
        ${c.verdict === "BET" || c.verdict === "LIMIT" ? `<div class="size-l">Size: to win <b>${money(c.to_win || 20)}</b> — ${sizeRule(c.tag)}.</div>` : ""}
        ${whyBets([c.tag, ...(c.with || [])], c.players, c.side)}
        <div class="sub">${esc(c.why || "")}</div>
        ${p ? `<div class="placed">Placed on ${esc(p.venue_name)}: ${esc(p.holding)} at ${p.venue === "kalshi" ? Math.round(p.price * 100) + "¢" : amer(p.american)}, to win ${money(p.to_win)}</div>`
          : skipWhy[c.key] ? `<div class="sub" style="margin-top:4px">Not placed: ${esc(skipWhy[c.key])}</div>` : ""}
      </div>
      <div class="px">${best ? `<b>${esc(best.venue_name)} ${esc(best.price_txt)}</b>${esc(best.contract)}<br>${pct(best.ev)} expected` : "no price yet"}</div>
      ${(c.shop || []).length > 1 ? `<details class="shop"><summary>Every price (${c.shop.length})</summary><table>${c.shop.map(q =>
        `<tr><td>${esc(q.venue_name)}${q.mine ? "" : " <span class='muted'>(no account)</span>"}</td><td>${esc(q.contract)}</td><td class="r n">${esc(q.price_txt)}</td><td class="r">${pct(q.ev)}${q.fee_counted ? "" : "*"}</td></tr>`).join("")}</table><div>* fees not counted</div></details>` : ""}
    </div>`;
  };
  const moved = r => `<div class="row"><div class="verdict">MOVED</div>
      <div><div class="pick">${esc(r.label)}</div><div class="sub">${esc(r.away)} @ ${esc(r.home)}, ${esc(when(r.tip_utc))}. ${badge(r.group)}${esc(r.tag)}</div>
      <div class="sub">Fired at ${esc(r.label)}; the line is now ${r.now_line == null ? "off the board" : esc(r.now_line)} and the model doesn't want it there. If you already have it, it's graded at the original number.</div></div><div></div></div>`;
  $("tab-card").innerHTML = `<h2>Today's card</h2>
    <p class="lede">Today's bets, best first. BET: the price is good and it gets placed. LIMIT: placed only if the price comes to us. PASS: no bet. CONFLICT: our systems are on both sides of the game, so no bet.</p>` +
    (card.length ? card.map(row).join("") : `<div class="empty">Nothing on the card right now. The model checks again every few minutes.</div>`) +
    (hold.length ? `<h2>Line moved</h2><p class="lede">Fired earlier at a better number. Only counts if you got that number.</p>` + hold.map(moved).join("") : "");
}

// ---------- results
function renderResults(b) {
  const done = b.card_done || [], hist = b.history || [];
  const row = r => `<div class="row"><div class="verdict ${r.status === "FINAL" ? r.result : ""}">${r.status === "FINAL" ? (r.result === "W" ? "WON" : r.result === "L" ? "LOST" : "PUSH") : "LIVE"}</div>
      <div><div class="pick">${esc(r.label)}</div><div class="sub">${esc(r.away)} @ ${esc(r.home)}, ${esc(when(r.tip_utc))}${r.final_score ? ". Final " + esc(r.final_score) : ""}</div>
      <div class="sub">${badge(r.group)}${esc(r.tag)}</div></div>
      <div class="px">${r.status === "FINAL" ? `<b>${r.result === "W" ? "+1.00u" : r.result === "L" ? "−1.10u" : "0u"}</b>` : ""}${r.clv != null && r.status === "FINAL" ? `beat the close by ${r.clv > 0 ? "+" : ""}${r.clv}` : ""}</div></div>`;
  $("tab-results").innerHTML = `<h2>Last 30 hours</h2><p class="lede">Card bets that tipped, graded at the card's number in units (risk 1.1 to win 1).</p>` +
    (done.length ? done.map(row).join("") : `<div class="empty">No card bets have tipped in the last 30 hours.</div>`) +
    `<h2>Every graded OG bet</h2>` +
    (hist.length ? `<table><tbody>${hist.map(p => `<tr><td class="n ${p.result}" style="font-size:20px;font-weight:700;width:30px">${p.result}</td>
      <td><b>${esc(p.label)}</b> <span class="muted">S${p.system}</span><div class="muted" style="font-size:14px">${esc(p.final_score)}, ${esc(p.game_date)}</div></td></tr>`).join("")}</tbody></table>`
      : `<div class="empty">No graded OG bets yet. Results post the morning after each game.</div>`);
}

// ---------- systems: every system, last two seasons replayed + this season live
let sysFilter = "ALL";
function pastFor(tag) {
  const R = rc();
  if (tag === "T13") return { seasons: (R.players_gap || {})["4+"] || {}, note: "players model, gap 4+" };
  if (tag === "MONEYBALL") return { seasons: R.moneyball || {} };
  if ((R.systems || {})[tag]) return { seasons: R.systems[tag] };
  if ((R.other || {})[tag]) return { span: R.other[tag] };
  return { seasons: {} };
}
function renderSystems(b) {
  const groups = {
    OG: Object.entries(b.systems || {}).map(([id, s]) => ({ ...s, tag: "S" + id, group: "OG", rule: "" })),
    FAV: Object.values(b.test_systems || {}).filter(s => s.group === "FAV"),
    EARLY: Object.values(b.early_systems || {}),
    TEST: Object.values(b.test_systems || {}).filter(s => s.group !== "FAV"),
  };
  groups.ALL = [...groups.OG, ...groups.FAV, ...groups.EARLY, ...groups.TEST];
  const names = { ALL: "All", OG: "OG", FAV: "Card", EARLY: "Early season", TEST: "Tracking only" };
  const status = s => (b.benched || {})[s.tag] ? `<span class="dot bench">Benched: ${esc(b.benched[s.tag].why)}</span>`
    : s.group === "OG" || s.group === "FAV" ? `<span class="dot on">Bets</span>`
    : s.group === "EARLY" ? `<span class="dot on">Bets when the players model agrees by 3+</span>` : `<span class="dot">Tracking only, no money</span>`;
  const cell = (r, lab) => `<td class="r ${recCellTone(r)}" data-label="${lab}">${recCell(r)}</td>`;
  const rows = (groups[sysFilter] || []).map(s => {
    const P = pastFor(s.tag);
    const past = P.span ? `<td colspan="2" class="r span ${recCellTone(P.span)}" data-label="Earlier seasons">${recCell(P.span)}<span class="pc muted"> ${esc(P.span.label)}</span></td>`
      : cell((P.seasons || {})[SEASONS[0]], SEASONS[0]) + cell((P.seasons || {})[SEASONS[1]], SEASONS[1]);
    const rule = String(s.rule || "").replace(/\s*\d+ seasons?:.*$/, "").replace(/\.\s*$/, "");
    return `<tr><td><div class="nm"><span class="tag">${esc(s.tag)}</span>${esc(s.name || "")}</div>${rule ? `<div class="rule">${esc(rule)}</div>` : ""}${status(s)}</td>
      ${past}${cell(s, "This season")}<td class="r hide-s">${s.avg_clv == null ? `<span class="muted">—</span>` : `<b class="n ${s.avg_clv > 0 ? "pos" : s.avg_clv < 0 ? "neg" : ""}">${s.avg_clv > 0 ? "+" : ""}${s.avg_clv}</b>`}</td></tr>`;
  }).join("");
  $("tab-systems").innerHTML = `<h2>Systems</h2>
    <p class="lede">Every system the model runs. The two past seasons are replayed at the opening line. This season counts live picks under today's rules. Beat close is how many points the line moved our way after the pick; above zero is good, and a system that stays below zero over 30+ picks gets benched.</p>
    <div class="seg" role="group">${Object.keys(names).map(k => `<button data-f="${k}" aria-pressed="${k === sysFilter}">${names[k]} <span class="muted">${groups[k].length}</span></button>`).join("")}</div>
    ${rows ? `<div class="sys"><table><thead><tr><th>System</th><th class="r">${SEASONS[0]}</th><th class="r">${SEASONS[1]}</th><th class="r">This season</th><th class="r hide-s">Beat close</th></tr></thead><tbody>${rows}</tbody></table></div>
    <p class="why-note" style="margin-top:8px">Green = 55%+, red = under 52.4% (losing after the vig); colored only with 20+ picks.</p>`
      : `<div class="empty">No systems in this group.</div>`}`;
  $("tab-systems").querySelectorAll(".seg button").forEach(btn => btn.onclick = () => { sysFilter = btn.dataset.f; renderSystems(b); });
}

// ---------- model lab
function renderLab(b) {
  const box = (title, note, inner, open = false) => `<details class="box"${open ? " open" : ""}><summary>${title}${note ? `<small>${note}</small>` : ""}</summary><div class="inner">${inner}</div></details>`;
  const G = b.gap_tracker;
  let gaps = "";
  if (G) {
    const live = r => r && r.n ? `${wl(r)} · ${r.win_pct == null ? "—" : Math.round(r.win_pct * 100) + "%"} · ${r.units > 0 ? "+" : ""}${r.units}u` : "—";
    const hist = g => g && (g.w + g.l) ? `${g.w}-${g.l} · ${Math.round(g.w / (g.w + g.l) * 100)}%` : "—";
    const W = G.window, hw = G.history_by_gap || {};
    const head = `<tr><th></th><th class="r">This season</th><th class="r">2 seasons, ${esc(W)}</th><th class="r">2 seasons, full</th></tr>`;
    gaps = `<div class="grid2"><div><h3>By gap size</h3><table>${head}${["0-2", "2-3", "3-4", "4-5", "5+", "3+"].map(k => `<tr><td>${k === "3+" ? "<b>3+ (T13)</b>" : "gap " + k}</td><td class="r">${live(G.by_gap[k])}</td><td class="r">${hist((hw[W] || {})[k])}</td><td class="r">${hist((hw["whole season"] || {})[k])}</td></tr>`).join("")}</table></div></div>`;
  }
  const st = b.stacks || [];
  const stacks = st.length ? st.map(x => `<div class="game"><div><div class="t">${esc(x.label)}</div><div class="muted" style="font-size:14px">${esc(x.away)} @ ${esc(x.home)}, ${esc(when(x.tip_utc))}</div></div><div>${x.groups.map(badge).join("")}<span class="muted">${esc(x.systems.join(" + "))}</span></div></div>`).join("") : `<div class="muted">No stacks on today's games.</div>`;
  const cases = (b.slate || []).filter(g => g.personnel && g.personnel.case).map(g => {
    const c = g.personnel.case;
    return `<div class="case"><div class="pick">${esc(c.side)} ${c.line > 0 ? "+" : ""}${c.line === 0 ? "PK" : c.line} <span class="chip ${c.level}" style="vertical-align:4px">${c.level}</span></div>
      <div class="muted" style="font-size:14px">${esc(g.away)} @ ${esc(g.home)}, ${esc(when(g.tip_utc))}. Cushion ${c.cushion > 0 ? "+" : ""}${c.cushion} pts, weakest check ${c.worst > 0 ? "+" : ""}${c.worst} pts${c.measured && c.measured.pct != null ? `, same spot over 2 seasons ${c.measured.w}-${c.measured.l}` : ""}.</div>
      ${c.sections.map(s => `<details><summary>${esc(s.title)}</summary>${s.lines.map(l => `<div class="cl ${l.startsWith("  ") ? "sub" : ""}">${esc(l.trim())}</div>`).join("")}</details>`).join("")}</div>`;
  }).join("") || `<div class="muted">No players-model cases on today's games.</div>`;
  const all = [...(b.bets || []), ...(b.tests || []), ...(b.early || [])];
  const slate = (b.slate || []).length ? b.slate.map(g => {
    const fired = (g.picks || []).map(k => all.find(p => p.key === k)).filter(Boolean);
    const hs = g.home_spread;
    const line = hs == null ? "no line" : `${hs < 0 ? g.home : hs > 0 ? g.away : "PK"} ${hs === 0 ? "" : "−" + Math.abs(hs)}`;
    const v = g.personnel;
    return `<div class="game"><div><div class="t">${esc(g.away)} @ ${esc(g.home)}</div>
        <div class="muted" style="font-size:14px">${esc(when(g.tip_utc))}${v && v.gap != null ? `. Players model: ${v.fair < 0 ? esc(g.home) + " −" + Math.abs(v.fair) : v.fair > 0 ? esc(g.away) + " −" + v.fair : "PK"}, gap ${v.gap > 0 ? "+" : ""}${v.gap}` : ""}</div>
        ${fired.length ? `<div style="margin-top:4px">${fired.map(p => `${badge(p.group)}<span style="margin-right:10px">${esc(p.tag)} ${esc(p.label)}</span>`).join("")}</div>` : ""}</div>
      <div class="r n" style="font-size:18px;text-align:right">${esc(line)}<div class="muted">${g.total ?? "—"}</div></div></div>`;
  }).join("") : `<div class="muted">No games today or tomorrow.</div>`;
  const T = b.tracking || {};
  const H = T.history || {};
  const cell = r => r && r.n ? `${wl(r)} · ${r.units > 0 ? "+" : ""}${r.units}u` : "—";
  const tbl = (title, key) => {
    const obj = T[key] || {}, hist = H[key] || {};
    const keys = [...new Set([...Object.keys(obj), ...Object.keys(hist)])]
      .sort((a, b) => ((obj[b] || {}).n || 0) - ((obj[a] || {}).n || 0) || ((hist[b] || {}).n || 0) - ((hist[a] || {}).n || 0));
    return `<div><h3>${title}</h3>${keys.length ? `<table><tr><th></th><th class="r">This season</th><th class="r">Last 2 seasons</th></tr>${keys.map(k =>
      `<tr><td>${esc(k)}</td><td class="r">${cell(obj[k])}</td><td class="r muted">${cell(hist[k])}</td></tr>`).join("")}</table>` : `<div class="muted">Nothing graded yet.</div>`}</div>`; };
  const allSys = { ...(b.systems || {}), ...(b.test_systems || {}), ...(b.early_systems || {}), ...(b.shadow_systems || {}) };
  const sysRows = Object.values(allSys).filter(s => s.if_first && s.if_first.n);
  const rec = r => r && r.n ? `${wl(r)} · ${r.units > 0 ? "+" : ""}${r.units}u` : "—";
  const firstTbl = `<h3 style="font:600 16px var(--cond);color:var(--muted);margin:16px 0 4px">Each system: official, at first line, and how much the line moved our way</h3>${sysRows.length ? `<table><tr><th></th><th class="r">Official</th><th class="r">At first line</th><th class="r">Avg CLV</th></tr>${sysRows.map(s =>
      `<tr><td>${badge(s.group)}${esc(s.tag)}</td><td class="r">${rec(s)}</td><td class="r">${rec(s.if_first)}</td><td class="r">${s.avg_clv == null ? "—" : (s.avg_clv > 0 ? "+" : "") + s.avg_clv}</td></tr>`).join("")}</table>` : `<div class="muted">Fills in after the first games are graded.</div>`}`;
  const variations = `<p class="muted" style="font-size:14px">This season is live results; "last 2 seasons" is the same thing replayed on 2024-25 and 2025-26 at the opening line. Small samples are noise until they aren't.</p><div class="grid2">${tbl("How many systems agreed", "by_count")}${tbl("Stacks + the players model", "stack_vs_personnel")}${tbl("Each group vs the players model", "system_vs_personnel")}${tbl("Each system vs the players model", "each_system_vs_personnel")}${tbl("Every pair of systems", "by_pair")}${tbl("Stacks by group", "by_groups")}${tbl("Stacks by exact systems", "by_combo")}${tbl("Players model by gap", "personnel_by_gap")}${tbl("Players model by status", "personnel_by_call")}</div>${firstTbl}<p class="muted" style="font-size:14px">Games where systems landed on opposite sides: ${T.conflicts ?? 0}</p>`;
  const testsToday = (b.tests || []).length ? b.tests.map(p => `<div class="game"><div><div class="t">${badge(p.group)}${esc(p.tag)} ${esc(p.label)}</div><div class="muted" style="font-size:14px">${esc(p.away)} @ ${esc(p.home)}, ${esc(when(p.tip_utc))}. ${(p.evidence || []).map(esc).join(". ")}</div></div><div></div></div>`).join("") : `<div class="muted">No test systems fired on today's games.</div>`;
  const early = (b.early || []).length ? b.early.map(p => `<div class="game"><div><div class="t">${badge(p.group)}${esc(p.tag)} ${esc(p.label)}</div><div class="muted" style="font-size:14px">${esc(p.away)} @ ${esc(p.home)}, ${esc(when(p.tip_utc))}. ${(p.evidence || []).map(esc).join(". ")}</div></div><div></div></div>`).join("") : `<div class="muted">No early-season systems fired on today's games.</div>`;
  const sc = b.scoring;
  $("tab-lab").innerHTML = `<h2>Model lab</h2><p class="lede">Everything the model tracks behind the card. Open a section to dig in.</p>` +
    box("Today and tomorrow", `${(b.slate || []).length} games, lines from ${esc(b.line_source)}`, slate) +
    box("Why the players model likes it", `${(b.slate || []).filter(g => g.personnel && g.personnel.case).length} cases`, cases) +
    box("Every game tracker", G ? `${G.pending} waiting on results` : "", gaps || `<div class="muted">Fills in after the first games are graded.</div>`) +
    box("Stacks", `${st.length} today`, stacks) +
    box("Early-season picks", `${(b.early || []).length} today`, early) +
    box("Testing picks", `${(b.tests || []).length} today, tracked only`, testsToday) +
    box("Every variation", "graded live", variations) +
    (sc && sc.season && sc.season.n ? `<p class="foot">Scoring vs closing totals this season: overs ${sc.season.overs}-${sc.season.unders}, ${sc.season.avg > 0 ? "+" : ""}${sc.season.avg} points a game.</p>` : "");
}

// ---------- power rankings
function renderRankings(b) {
  const p = b.power || {};
  const teams = p.teams || [];
  const sign = x => x == null ? "—" : `${x > 0 ? "+" : x < 0 ? "−" : ""}${Math.abs(x).toFixed(1)}`;
  $("tab-rankings").innerHTML = `<h2>Power rankings</h2>
    <p class="lede">Every team, best to worst, by the model's number for tonight: the players who are available
    (out players removed, questionable players counted), plus how the team has played this season versus what its players
    predicted. Rating is points per 100 possessions vs an average team, so two teams' gap is roughly the spread on a neutral court.
    Updates every time the model runs${p.at ? ` · last ${esc(ago(p.at))}` : ""}.</p>` +
    (teams.length ? `<div style="overflow-x:auto"><table class="lb"><thead><tr><th>#</th><th>Team</th><th>Rating</th>
      <th class="hide-s">Players</th><th class="hide-s">Results so far</th><th class="hide-s">Market rank</th><th>Record</th><th class="hide-s">Carries them</th><th class="hide-s">Missing</th></tr></thead><tbody>` +
      teams.map(t => `<tr><td class="n">${t.rank}</td><td><b>${esc(t.team)}</b>${t.blind ? ` <span class="chip Low" title="The model can't fully rate this team right now">blind spot</span>` : ""}</td>
        <td class="n ${t.rating > 0 ? "pos" : t.rating < 0 ? "neg" : ""}"><b>${sign(t.rating)}</b></td>
        <td class="n hide-s">${sign(t.players)}</td>
        <td class="n hide-s" title="${t.results_games ? `${Math.abs(t.results_miss)} pts/game ${t.results_miss >= 0 ? "better" : "worse"} than its players predicted over ${t.results_games} games` : "no games yet"}">${t.results_games ? `${sign(t.results_adj)} <span class="muted">(${t.results_games} g)</span>` : "—"}</td>
        <td class="n hide-s">${t.market_rank ?? "—"}</td>
        <td class="n">${esc(t.record || "0-0")}</td>
        <td class="hide-s muted" style="font-size:14px">${(t.best || []).map(x => `${esc(x.name)} ${sign(x.impact)}`).join(", ")}</td>
        <td class="hide-s muted" style="font-size:14px">${[...(t.out || []).map(n => esc(n) + " (out)"), ...(t.questionable || []).map(n => esc(n) + " (?)")].join(", ") || ""}</td></tr>`).join("") +
      `</tbody></table></div>` : `<p class="muted">Rankings appear after the next model run.</p>`);
}

function render(b) {
  // keep whatever the viewer opened across the once-a-minute refresh
  const openNow = [...document.querySelectorAll("main details")].map((el, i) => el.open ? i : -1).filter(i => i >= 0);
  const placed = b.placed || { bets: [], summary: null };
  BOARD = b;
  placedKeys = new Set((placed.bets || []).map(x => x.key));
  renderHead(b, placed);
  renderBets(placed, b);
  renderCard(b, placed);
  renderRankings(b);
  renderResults(b);
  renderSystems(b);
  renderLab(b);
  const all = document.querySelectorAll("main details");
  openNow.forEach(i => { if (all[i]) all[i].open = true; });
}

async function tick() {
  try { render(await load()); }
  catch (e) { $("fresh").querySelector("span").textContent = "Can't load the board"; $("status").textContent = e.message; }
}
tick();
setInterval(tick, 60000);
</script>
</body>
</html>
